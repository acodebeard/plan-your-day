name: Plugin Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  php-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/plan-your-day
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: plugin/plan-your-day

      - run: composer lint

  phpcs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/plan-your-day
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: plugin/plan-your-day

      - run: composer phpcs

  phpunit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/plan-your-day
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: plugin/plan-your-day

      - run: composer phpunit

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: plugin/plan-your-day
          composer-options: "--no-dev --optimize-autoloader"

      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./plugin/plan-your-day
          exclude-directories: tests
